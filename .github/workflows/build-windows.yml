name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '同时发布 GitHub Release（版本号取 package.json，自动创建 v 标签）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test-linux:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 安装 Electron 运行依赖
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libatk-bridge2.0-0
      - name: 界面测试（演示模式）
        run: xvfb-run -a npx playwright test test/e2e/app.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore

  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 单元测试 + CLI 契约测试（Windows）
        run: npm test
      - name: 打包
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 冒烟测试：内置 ntn.exe 与 dida-cli
        run: node scripts/smoke-packaged.mjs release/win-unpacked
      - name: 冒烟测试：打包后的应用能找到内置 CLI
        run: npx playwright test test/e2e/packaged.spec.ts
        env:
          FLOWSYNC_PACKAGED_APP: ${{ github.workspace }}\release\win-unpacked\FlowSync.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FlowSync-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          # 推送 v 标签时用该标签；手动运行时按 package.json 的版本号在当前提交上创建标签
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: FlowSync v${{ steps.version.outputs.version }}
          body: |
            下载下面的 `FlowSync-Setup-${{ steps.version.outputs.version }}.exe` 安装即可。
            安装包没有数字签名，第一次运行时 Windows 可能提示“Windows 已保护你的电脑”，点“更多信息 → 仍要运行”。
            使用说明见仓库 README。
